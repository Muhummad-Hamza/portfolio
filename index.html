<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">
    <main class="flex-grow flex items-center justify-center px-6 py-12">
        <div class="max-w-4xl text-center">
            <h1 class="text-4xl sm:text-6xl font-bold leading-tight">Hi! I'm <span class="text-orange-500">Muhammad Hamza</span></h1>
            <p class="text-lg text-gray-400 mt-4">A Computer Science Student & Developer who builds creative web and AI projects.</p>
            <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
                <a href="about.html" class="inline-block px-6 py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 transition">More About Me</a>
                <a href="projects.html" class="inline-block px-6 py-3 border border-orange-500 text-orange-500 font-semibold rounded-lg hover:bg-orange-500 hover:text-white transition">View Projects</a>
            </div>
        </div>
    </main>
    
    <div class="fixed top-4 left-4 z-50">
        <input type="checkbox" id="menu-toggle" class="hidden">
        <label for="menu-toggle" class="cursor-pointer text-2xl">☰</label>
        <div class="hidden absolute top-10 left-0 w-48 bg-gray-800 p-4 space-y-2 text-center rounded-lg shadow-lg" id="menu">
            <a href="about.html" class="block py-2 hover:text-orange-500">About</a>
            <a href="projects.html" class="block py-2 hover:text-orange-500">Projects</a>
            <a href="contact.html" class="block py-2 hover:text-orange-500">Contact</a>
        </div>
    </div>
    
    <style>
        #menu-toggle:checked ~ #menu {
            display: block;
        }
    </style>

    <footer class="bg-gray-800 text-center p-6 text-gray-400">
        <p>Thanks for visiting my portfolio.</p>
    </footer>
</body>
</html>
