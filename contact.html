<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Muhammad Hamza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">
    <header class="relative z-20 px-4 pt-4 sm:px-6 lg:px-8">
        <nav class="mx-auto flex max-w-6xl items-center justify-between sm:justify-center relative rounded-lg sm:rounded-full border border-white/10 bg-gradient-to-r from-gray-900/60 via-gray-950/50 to-gray-900/50 px-4 py-2 sm:py-3 shadow-lg shadow-black/30 backdrop-blur-md">
            <div class="flex items-center">
                <a href="index.html" class="sr-only">Home</a>
            </div>

            <div class="hidden sm:flex sm:absolute sm:left-1/2 sm:transform sm:-translate-x-1/2 items-center gap-8 text-sm text-gray-300">
                <a href="index.html" class="px-4 py-2 rounded-full text-gray-300 hover:text-white transition hover:bg-white/5">Home</a>
                <a href="about.html" class="px-4 py-2 rounded-full text-gray-300 hover:text-orange-400 transition hover:bg-orange-500/5">About</a>
                <a href="projects.html" class="px-4 py-2 rounded-full text-gray-300 hover:text-orange-400 transition hover:bg-orange-500/5">Projects</a>
                <a href="contact.html" class="px-4 py-2 rounded-full text-white/90 bg-white/5">Contact</a>
            </div>

            <div class="sm:hidden relative">
                <input type="checkbox" id="menu-toggle" class="hidden">
                <label for="menu-toggle" class="cursor-pointer text-2xl text-gray-200">☰</label>
                <div class="hidden absolute right-4 top-14 w-52 rounded-2xl border border-white/8 bg-gray-900/95 p-4 text-center shadow-xl" id="menu">
                    <a href="index.html" class="block py-2 hover:text-orange-500">Home</a>
                    <a href="about.html" class="block py-2 hover:text-orange-500">About</a>
                    <a href="projects.html" class="block py-2 hover:text-orange-500">Projects</a>
                    <a href="contact.html" class="block py-2 hover:text-orange-500">Contact</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow">
    <div class="max-w-4xl mx-auto p-8 text-center">
        <h1 class="text-5xl font-bold text-orange-500">Contact Me</h1>
        <p class="text-lg text-gray-400 mt-4">Feel free to reach out to me via email or by using the form below.</p>
    </div>

    <div class="max-w-4xl mx-auto p-8">
        <div class="bg-gray-800 shadow-lg rounded-lg p-6">
            <form action="https://formsubmit.co/mhamzashehzad2007@gmail.com" method="POST">
                <input name="name" type="text" placeholder="Your Name" class="w-full p-3 rounded-lg bg-gray-700 text-white mb-4" required>
                <input name="email" type="email" placeholder="Your Email" class="w-full p-3 rounded-lg bg-gray-700 text-white mb-4" required>
                <textarea name="message" placeholder="Your Message" rows="6" class="w-full p-3 rounded-lg bg-gray-700 text-white mb-4" required></textarea>
                <button type="submit"  class="w-full px-4 py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 transition">Send Message</button>
            </form>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-8 text-center">
        <a href="index.html" class="px-6 py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 transition">Back to Home</a>
    </div>
    </main>

    <style>
        #menu-toggle:checked ~ #menu { display: block; }
    </style>

</body>

</html>
